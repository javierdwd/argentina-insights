[project]
name = "argentina-insights-agent"
version = "0.1.0"
description = "Argentina Insights — FastAPI + LangGraph backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "copilotkit>=0.1.96",
    "langgraph>=1.2.11",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "langchain-core>=1.6.2",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.3",
    "pydantic>=2.13.5",
    "numpy>=2.2.0",
    "openai>=1.99.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
